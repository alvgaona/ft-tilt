name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: lint
          cache: true
      - name: Lint commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            pixi run -e lint commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          elif git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            pixi run -e lint commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            pixi run -e lint commitlint --last --verbose  # new branch or force push: no range to compare
          fi

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: default
          cache: true
      - name: Build and run the unit tests
        run: pixi run test

  # The poster (poster/): build the site and the PDF, and attach the PDF to the run.
  poster:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poster
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec posuta install --with-deps
      - name: Build the site and the PDF
        run: pnpm pdf
      - uses: actions/upload-artifact@v7
        with:
          name: poster
          path: poster/dist/poster.pdf
