# ICRIS18 Fig. 6-7, battery:=4s. The paper gives no sign. With motor 2 off only a -My pulse is
# rejectable (reachable My is [-0.44, +2.9] N·m at hover, derived).
experiment_runner:
  ros__parameters:
    duration: 40.0
    fault_time: 10.0
    fault_motor: 2
    fault_health: 0.0
    disturbance_start: 20.0
    disturbance_end: 30.0
    disturbance_torque: [0.0, -1.0, 0.0]
    # Fig. 6-7 are an attitude-only simulation, so no position hold.
    position_kp: 0.0
    position_ki: 0.0
    position_kd: 0.0
