# RPIC17 §V, Fig. 7-8: partial fault (motor 2 limited to 40 % of its maximum thrust) switched on in hover,
# then off. Run with gamma_deg:=107 (recovers) and gamma_deg:=90 (loses control).
experiment_runner:
  ros__parameters:
    duration: 40.0
    fault_time: 15.0
    fault_clear_time: 30.0
    fault_motor: 2
    fault_health: 0.4
