[workspace]
name = "ft-tilt"
version = "0.1.0"
description = "Fault-tolerant tilted-rotor hexacopter (Giribet et al.) simulated in Gazebo Harmonic"
authors = ["Alvaro Gaona <alvgaona@gmail.com>"]
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]

# libcxx 23 dropped std::wstring_convert, still used by rosidl headers (as in Aerostack2's workspace).
[workspace.target.osx-arm64.build-variants]
c_compiler_version = ["22"]
cxx_compiler_version = ["22"]

[dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-ros-gz = "*"
ros-jazzy-xacro = "*"
ros-jazzy-actuator-msgs = "*"
ros-jazzy-rosbag2 = "*"
ros-jazzy-ament-cmake-gtest = "*"
eigen = "*"
colcon-common-extensions = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
c-compiler = "*"
cxx-compiler = "*"
scipy = "*"  # as2_motion_reference_handlers (Python) imports it but does not declare it
as2_msgs = { git = "https://github.com/aerostack2/aerostack2.git", branch = "main", subdirectory = "as2_msgs" }
as2_core = { git = "https://github.com/aerostack2/aerostack2.git", branch = "main", subdirectory = "as2_core" }
as2_motion_reference_handlers = { git = "https://github.com/aerostack2/aerostack2.git", branch = "main", subdirectory = "as2_motion_reference_handlers" }
as2_motion_controller = { git = "https://github.com/aerostack2/aerostack2.git", branch = "main", subdirectory = "as2_motion_controller" }
as2_behavior = { git = "https://github.com/aerostack2/aerostack2.git", branch = "main", subdirectory = "as2_behaviors/as2_behavior" }
as2_behaviors_motion = { git = "https://github.com/aerostack2/aerostack2.git", branch = "main", subdirectory = "as2_behaviors/as2_behaviors_motion" }
as2_behaviors_platform = { git = "https://github.com/aerostack2/aerostack2.git", branch = "main", subdirectory = "as2_behaviors/as2_behaviors_platform" }
as2_state_estimator = { git = "https://github.com/aerostack2/aerostack2.git", branch = "main", subdirectory = "as2_state_estimator" }
as2_python_api = { git = "https://github.com/aerostack2/aerostack2.git", branch = "main", subdirectory = "as2_python_api" }

[tasks]
build = "colcon build --symlink-install --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=Release"
test = { cmd = "colcon test --event-handlers console_direct+ && colcon test-result --verbose", depends-on = ["build"] }
sim = { cmd = "bash -c 'source install/setup.bash && ros2 launch ft_tilt_bringup sim.launch.py \"$@\"' --", depends-on = ["build"] }
experiment = { cmd = "bash -c 'source install/setup.bash && ros2 launch ft_tilt_bringup experiment.launch.py \"$@\"' --", depends-on = ["build"] }
as2 = { cmd = "bash -c 'source install/setup.bash && ros2 launch ft_tilt_as2 as2.launch.py \"$@\"' --", depends-on = ["build"] }
mission = "bash -c 'source install/setup.bash && ros2 run ft_tilt_as2 mission.py \"$@\"' --"
test-missions = { cmd = "bash -c 'source install/setup.bash && python3 ft_tilt_as2/scripts/test_missions.py \"$@\"' --", depends-on = ["build"] }

[feature.lint.dependencies]
nodejs = "*"
lefthook = "*"

[feature.lint.tasks]
lint-install = { cmd = "npm ci --no-audit --no-fund", inputs = ["package-lock.json"], outputs = ["node_modules/.package-lock.json"] }
commitlint = { cmd = "npx --no-install commitlint", depends-on = ["lint-install"] }
hooks = { cmd = "lefthook install", depends-on = ["lint-install"] }

[environments]
lint = { features = ["lint"], no-default-feature = true }
