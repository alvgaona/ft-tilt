<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" data-diagram="">
  <style>
    /* Colours come from the poster's tokens; the fallbacks keep the file legible on its own.
       Scoped by data-diagram: Astro replaces the root's class with the one Figure gives it. */
    svg[data-diagram] { font-family: var(--font-body, system-ui, sans-serif); }
    svg[data-diagram] .b { fill: var(--bg, #fff); stroke: var(--muted, #6f6e77); stroke-width: 1.2; }
    svg[data-diagram] .b.new { fill: var(--accent-tint, #eef2fd); stroke: var(--accent, #1348dc); }
    svg[data-diagram] .lane { fill: none; stroke: var(--border, #e9e8ea); stroke-width: 1.5; stroke-dasharray: 5 4; }
    svg[data-diagram] .bus { fill: var(--surface, #f9f8f9); stroke: var(--muted, #6f6e77); stroke-width: 1; }
    svg[data-diagram] .w { fill: none; stroke: var(--muted, #6f6e77); stroke-width: 1.4; }
    svg[data-diagram] .w.f { stroke: var(--c-fault, #d97706); stroke-dasharray: 5 3; }
    svg[data-diagram] .dot, svg[data-diagram] .head { fill: var(--muted, #6f6e77); }
    svg[data-diagram] .head.f, svg[data-diagram] .dot.f { fill: var(--c-fault, #d97706); }
    svg[data-diagram] .t { fill: var(--fg, #282a30); font-size: 14px; text-anchor: middle; }
    svg[data-diagram] .s { fill: var(--muted, #6f6e77); font-size: 11.5px; text-anchor: middle; }
    svg[data-diagram] .s.l { text-anchor: start; }
    svg[data-diagram] .s.r { text-anchor: end; }
    svg[data-diagram] .s.f { fill: var(--c-fault, #d97706); }
    svg[data-diagram] .ln { fill: var(--muted, #6f6e77); font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
    svg[data-diagram] .fo { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--fg, #282a30); font-size: 13px; line-height: 1; white-space: nowrap; }
    svg[data-diagram] .fo .katex { font-size: 1.15em; }
  </style>

        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="head"/></marker>
          <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="head f"/></marker>
        </defs>
        <!-- lanes -->
        <rect class="lane" x="8" y="6" width="984" height="172" rx="10"/>
        <text class="ln" x="20" y="26">Companion computer · Aerostack2 · ROS 2</text>
        <rect class="lane" x="8" y="232" width="984" height="134" rx="10"/>
        <text class="ln" x="980" y="358" text-anchor="end">Flight controller + vehicle · Gazebo · 1 kHz physics</text>
        <!-- Aerostack2 lane -->
        <rect class="b new" x="20" y="44" width="110" height="56" rx="6"/>
        <text class="t" x="75" y="68">mission.py</text><text class="s" x="75" y="87">Python API</text>
        <path class="w" d="M130,72 H180" marker-end="url(#ah)"/>
        <rect class="b" x="180" y="44" width="150" height="56" rx="6"/>
        <text class="t" x="255" y="68">Behaviours</text><text class="s" x="255" y="87">take-off · go-to · land</text>
        <path class="w" d="M330,72 H400" marker-end="url(#ah)"/>
        <text class="s" x="365" y="64">reference</text>
        <rect class="b new" x="400" y="44" width="180" height="56" rx="6"/>
        <text class="t" x="490" y="68">Motion controller</text><text class="s" x="490" y="87">position PID · 100 Hz</text>
        <path class="w" d="M580,72 H660" marker-end="url(#ah)"/>
        <foreignObject x="582" y="44" width="76" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="fo">$\phi,\theta,\psi,T$</div></foreignObject>
        <rect class="b new" x="660" y="44" width="140" height="56" rx="6"/>
        <text class="t" x="730" y="68">Platform</text><text class="s" x="730" y="87">AerialPlatform</text>
        <path class="w" d="M800,72 H860" marker-end="url(#ah)"/>
        <text class="s" x="830" y="64">pose</text>
        <rect class="b" x="860" y="44" width="120" height="56" rx="6"/>
        <text class="t" x="920" y="68">State estimator</text><text class="s" x="920" y="87">ground truth</text>
        <path class="w" d="M920,44 V22 H490 V44" marker-end="url(#ah)"/>
        <text class="s" x="705" y="17">self-localization + tf</text>
        <!-- bridge bus -->
        <rect class="bus" x="20" y="190" width="960" height="30" rx="6"/>
        <text class="s" x="500" y="209">ros_gz_bridge · /ft_tilt/* ↔ /model/ft_tilt/*</text>
        <path class="w" d="M700,100 V190" marker-end="url(#ah)"/>
        <text class="s r" x="694" y="150">attitude_ref, thrust_ref</text>
        <path class="w" d="M700,220 V264" marker-end="url(#ah)"/>
        <path class="w" d="M780,190 V100" marker-end="url(#ah)"/>
        <text class="s l" x="786" y="150">odometry</text>
        <path class="w" d="M90,264 V220" marker-end="url(#ah)"/>
        <path class="w f" d="M75,100 V190" marker-end="url(#ahf)"/>
        <text class="s l f" x="82" y="150">motor_health: the fault skips Aerostack2</text>
        <path class="w f" d="M880,220 V264" marker-end="url(#ahf)"/>
        <!-- Gazebo lane -->
        <rect class="b new" x="640" y="264" width="300" height="56" rx="6"/>
        <text class="t" x="790" y="288">Flight controller · 200 Hz</text><text class="s" x="790" y="307">attitude PID → fault-aware allocation → ω</text>
        <path class="w" d="M640,292 H580" marker-end="url(#ah)"/>
        <foreignObject x="582" y="264" width="56" height="26"><div xmlns="http://www.w3.org/1999/xhtml" class="fo">$\omega_i$</div></foreignObject>
        <rect class="b" x="420" y="264" width="160" height="56" rx="6"/>
        <text class="t" x="500" y="288">Motor models × 6</text><text class="s" x="500" y="307">first-order lag, 1/20 s</text>
        <path class="w" d="M420,292 H360" marker-end="url(#ah)"/>
        <foreignObject x="362" y="264" width="56" height="26"><div xmlns="http://www.w3.org/1999/xhtml" class="fo">$f_i,\,\tau_i$</div></foreignObject>
        <rect class="b" x="220" y="264" width="140" height="56" rx="6"/>
        <text class="t" x="290" y="288">Rigid body</text><text class="s" x="290" y="307">2.1 kg, 6 DOF</text>
        <path class="w" d="M220,292 H160" marker-end="url(#ah)"/>
        <rect class="b" x="20" y="264" width="140" height="56" rx="6"/>
        <text class="t" x="90" y="288">Odometry</text><text class="s" x="90" y="307">200 Hz</text>
        <path class="w" d="M290,320 V340 H760 V320" marker-end="url(#ah)"/>
        <text class="s" x="525" y="335">pose, body rates (ground truth, no estimator)</text>
      </svg>
